# Runs the Forever claims check against the deployed Forever Worker.
# Needs repository secrets FOREVER_ORIGIN and FOREVER_SHARED_KEY (Settings > Secrets and variables > Actions).
# Optional secret FOREVER_TEST_SUB (your Discord ID, with claimed characters) adds the live /forever card test.
name: Forever claims check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run claims check against the deployed Worker
        env:
          FOREVER_ORIGIN: ${{ secrets.FOREVER_ORIGIN }}
          FOREVER_SHARED_KEY: ${{ secrets.FOREVER_SHARED_KEY }}
          FOREVER_TEST_SUB: ${{ secrets.FOREVER_TEST_SUB }}
        run: node forever-claims-check.mjs
